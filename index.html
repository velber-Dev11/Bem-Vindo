<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bem-vindo de volta! 🍫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbeee8; --text:#3a1d12; --muted:#7a5546;
  --choc:#6b3a24; --choc-dark:#4a2515; --choc-light:#8a4f33;
  --foil:#e0a526; --berry:#c2395b; --card:#fff8f4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d110b; --text:#fbeee8; --muted:#c9a898; --card:#2c1b12; --choc:#7a4228; --choc-light:#9a5a3a; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Nunito",system-ui,sans-serif; line-height:1.55;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:40px 20px 56px; text-align:center;
}
h1{
  font-family:"Fraunces",Georgia,serif; font-weight:900;
  font-size:clamp(2.2rem,7vw,4rem); line-height:1.05; margin:8px 0 12px; letter-spacing:-.02em;
}
.hello{font-size:1.15rem; color:var(--muted); margin:0 0 6px}
.sub{max-width:34rem; margin:0 auto 22px; font-size:1.05rem}
.name-row{display:flex; gap:8px; justify-content:center; margin-bottom:34px; flex-wrap:wrap}
.name-row input{
  font:inherit; padding:10px 16px; border-radius:999px; border:2px solid var(--choc-light);
  background:var(--card); color:var(--text); width:min(260px,100%);
}
.name-row input:focus-visible,.piece:focus-visible,button:focus-visible{outline:3px solid var(--berry); outline-offset:3px}
.name-row button, .again{
  font:inherit; font-weight:700; padding:10px 20px; border-radius:999px; border:0; cursor:pointer;
  background:var(--berry); color:#fff;
}
.wrap{
  background:linear-gradient(135deg,var(--foil),#f3cf6a 50%,var(--foil));
  padding:14px; border-radius:18px; box-shadow:0 14px 30px rgba(60,25,10,.28);
  max-width:100%;
}
.bar{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:min(420px,calc(100vw - 80px))}
.piece{
  aspect-ratio:1; border:0; cursor:pointer; border-radius:8px; position:relative;
  background:linear-gradient(145deg,var(--choc-light),var(--choc) 55%,var(--choc-dark));
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.14), inset -3px -3px 0 rgba(0,0,0,.28);
  transition:transform .25s, opacity .35s;
}
.piece::after{
  content:""; position:absolute; inset:24%; border-radius:4px;
  box-shadow:inset 2px 2px 0 rgba(0,0,0,.28), inset -2px -2px 0 rgba(255,255,255,.12);
}
.piece:hover{transform:translateY(-3px) rotate(-2deg)}
.piece.eaten{opacity:0; transform:translateY(40px) rotate(14deg) scale(.6); pointer-events:none}
.hint{color:var(--muted); margin:18px 0 0; font-size:.95rem}
.msg{
  min-height:92px; max-width:30rem; margin:22px auto 0; padding:18px 22px;
  background:var(--card); border-radius:14px; border-left:6px solid var(--berry);
  font-size:1.1rem; text-align:left; box-shadow:0 6px 16px rgba(60,25,10,.12);
}
.count{margin:14px 0 0; font-weight:700; color:var(--muted)}
.again{margin-top:16px; display:none}
@media (prefers-reduced-motion: reduce){ .piece,.piece.eaten{transition:none} }
</style>
</head>
<body>
<p class="hello" id="greeting">Bom dia!</p>
<h1 id="title">Bem-vindo de volta ao trabalho!</h1>
<p class="sub">As férias acabaram, mas a semana começa doce. Pegue um pedaço de chocolate e recarregue as energias.</p>

<div class="name-row">
  <input id="name" type="text" maxlength="30" placeholder="Qual é o seu nome?" aria-label="Seu nome">
  <button id="save" type="button">Salvar</button>
</div>

<div class="wrap"><div class="bar" id="bar"></div></div>
<p class="hint" id="hint">Toque em um quadradinho para comer. 🍫</p>
<div class="msg" id="msg" aria-live="polite">Sua mensagem do dia aparece aqui.</div>
<p class="count" id="count"></p>
<button class="again" id="again" type="button">Pegar outra barra</button>

<script>
const messages = [
  "Seu e-mail pode esperar mais cinco minutos. Primeiro o café.",
  "Você voltou descansado, e isso já é uma vantagem enorme.",
  "Escolha uma única tarefa pequena e comece por ela.",
  "A equipe inteira fica mais completa com você de volta. Juntos a gente vai longe.",
  "Você não esqueceu como fazer seu trabalho. Está tudo aí.",
  "Beba água. Sério, agora. Depois volte aqui.",
  "Uma semana de cada vez, um e-mail de cada vez.",
  "Você merece cada dia de descanso que teve. Agora vamos com calma.",
  "Hoje basta ser bom, não perfeito.",
  "A semana já começou e você está dentro."
];
const finale = "Pronto, o chocolate acabou e a semana começou. Bom retorno e ótimo trabalho! 🎉";
const bar = document.getElementById("bar");
const msg = document.getElementById("msg");
const count = document.getElementById("count");
const again = document.getElementById("again");
const hint = document.getElementById("hint");
let order = [], eaten = 0;

function greet(name){
  const h = new Date().getHours();
  const g = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  document.getElementById("greeting").textContent = g + (name ? ", " + name + "!" : "!");
  document.getElementById("title").textContent = name ? "Bem-vindo de volta, " + name + "!" : "Bem-vindo de volta ao trabalho!";
}

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function build(){
  bar.innerHTML = ""; eaten = 0; order = shuffle(messages);
  again.style.display = "none"; hint.style.display = "";
  msg.textContent = "Sua mensagem do dia aparece aqui.";
  count.textContent = "Restam " + messages.length + " pedaços";
  messages.forEach((_, i) => {
    const b = document.createElement("button");
    b.className = "piece"; b.type = "button";
    b.setAttribute("aria-label", "Pedaço de chocolate " + (i+1));
    b.addEventListener("click", () => {
      b.classList.add("eaten"); b.disabled = true;
      eaten++;
      const left = messages.length - eaten;
      msg.textContent = left === 0 ? finale : order[eaten-1];
      count.textContent = left === 0 ? "Barra completa!" : "Restam " + left + " pedaços";
      if(left === 0){ again.style.display = "inline-block"; hint.style.display = "none"; }
    });
    bar.appendChild(b);
  });
}

function saveName(){
  const v = document.getElementById("name").value.trim();
  try{ localStorage.setItem("nome-volta-ferias", v); }catch(e){}
  greet(v);
}

document.getElementById("save").addEventListener("click", saveName);
document.getElementById("name").addEventListener("keydown", e => { if(e.key === "Enter") saveName(); });
again.addEventListener("click", build);

let saved = "";
try{ saved = localStorage.getItem("nome-volta-ferias") || ""; }catch(e){}
document.getElementById("name").value = saved;
greet(saved);
build();
</script>
</body>
</html>
